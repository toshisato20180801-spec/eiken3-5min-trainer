<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.webmanifest">
  <title>英検3級 5分トレーナー</title>
  <style>
    :root{--bg:#0b1220;--card:#111827;--card2:#1f2937;--text:#f8fafc;--muted:#94a3b8;--accent:#38bdf8;--good:#22c55e;--warn:#f59e0b;--bad:#ef4444;--line:#334155}
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(180deg,#0b1220,#111827);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
    .wrap{max-width:760px;margin:auto;padding:18px 16px 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
    h1{font-size:20px;margin:0}.pill{padding:7px 10px;border-radius:999px;background:#0b1220;border:1px solid var(--line);font-size:13px;color:var(--muted)}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
    .stat b{display:block;font-size:19px}.stat span{font-size:11px;color:var(--muted)}.progress{height:8px;background:#0b1220;border-radius:999px;overflow:hidden;margin-bottom:18px}
    .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#38bdf8,#818cf8)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px 18px;min-height:380px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 16px 40px #0006}
    .small{font-size:13px;color:var(--muted);text-align:center}.word{font-size:42px;font-weight:900;text-align:center;margin:12px 0 4px}.meaning{font-size:25px;font-weight:800;text-align:center;margin:10px 0}
    .example{font-size:17px;line-height:1.6;text-align:center;margin:12px 0;color:#dbeafe}.jp{font-size:14px;color:var(--muted);text-align:center}
    button{appearance:none;border:none;border-radius:15px;padding:14px 12px;font-weight:800;font-size:16px;cursor:pointer;color:white;background:var(--card2);border:1px solid var(--line)}
    button.primary{background:linear-gradient(135deg,#0284c7,#4f46e5);border:none}button.good{background:#14532d;border-color:#166534}.warn{background:#78350f!important;border-color:#92400e!important}.bad{background:#7f1d1d!important;border-color:#991b1b!important}
    .row{display:flex;gap:10px;margin-top:14px}.row>*{flex:1}.menu,.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.menu button{min-height:90px}.choices button{min-height:60px}
    .hidden{display:none!important}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#172554;color:#bfdbfe;font-size:12px}.result{font-size:26px;font-weight:900;text-align:center}
    .install{margin-top:12px;background:#0b1220;border:1px dashed var(--line);border-radius:14px;padding:10px;text-align:center;color:var(--muted);font-size:12px}
    @media(max-width:540px){.stats{grid-template-columns:repeat(2,1fr)}.choices,.menu{grid-template-columns:1fr}.word{font-size:38px}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>英検3級 5分トレーナー</h1><div class="pill" id="streakPill">🔥 0日</div></div>
  <div class="stats">
    <div class="stat"><b id="xp">0</b><span>XP</span></div><div class="stat"><b id="today">0</b><span>今日の正解</span></div>
    <div class="stat"><b id="mastered">0</b><span>定着語</span></div><div class="stat"><b id="reviewDue">0</b><span>復習待ち</span></div>
  </div>
  <div class="progress"><i id="bar"></i></div>
  <section id="home" class="card">
    <div class="small">EIKEN Grade 3 Vocabulary Core v1 ・ 合格点への寄与が高い順</div>
    <div class="word" style="font-size:30px">今日も10問だけ。<br><span style="font-size:14px;color:#94a3b8"><span id="vocabCount"></span>項目から最適化</span></div><div class="meaning">重要語 → 苦手語 → 復習語を自動で優先。</div>
    <div class="menu">
      <button class="primary" onclick="startSession('mix')">🎯 おすすめ<br><span class="small">4択＋確認</span></button>
      <button onclick="startSession('choice')">⚡ 4択だけ<br><span class="small">テンポ重視</span></button>
      <button onclick="startSession('flash')">🧠 覚えた？<br><span class="small">自己評価</span></button>
      <button onclick="showWeak()">📉 苦手TOP<br><span class="small">弱点を見る</span></button>
    </div>
    <div class="install">Chromeで開いて使えます。学習履歴はこの端末に保存されます。</div>
  </section>
  <section id="quiz" class="card hidden">
    <div class="small"><span id="qnum">1</span> / 10　<span class="badge" id="modeBadge">4択</span>　<span class="badge" id="catBadge">Core A</span></div>
    <div class="word" id="word"></div><div class="small" id="hint"></div><div class="row"><button onclick="speakWord()">🔊 発音</button></div>
    <div id="choices" class="choices"></div>
    <div id="reveal" class="hidden"><div class="meaning" id="meaning"></div><div class="example" id="example"></div><div class="jp" id="exampleJp"></div>
      <div class="row"><button class="bad" onclick="rate(0)">まだ無理</button><button class="warn" onclick="rate(1)">あやしい</button><button class="good" onclick="rate(2)">覚えた</button></div>
    </div>
  </section>
  <section id="finish" class="card hidden"><div class="result">🎉 5分終了</div><div class="meaning" id="scoreText"></div><div class="small" id="finishText"></div>
    <div class="row"><button class="primary" onclick="showHome()">今日は終了</button><button onclick="startSession('mix')">もう10問</button></div>
  </section>
  <section id="weak" class="card hidden"><div class="result">📉 苦手TOP10</div><div id="weakList" style="margin-top:14px"></div><div class="row"><button class="primary" onclick="showHome()">戻る</button></div></section>
</div>
<script src="vocab-v1.js"></script>
<script>
const WORDS=window.EIKEN_VOCAB;

const KEY="eiken3_webapp_v2";let state=JSON.parse(localStorage.getItem(KEY)||"{}");state.progress=state.progress||{};state.xp=state.xp||0;state.today=state.today||0;state.lastDay=state.lastDay||"";state.streak=state.streak||0;
const dayKey=()=>new Date().toLocaleDateString("sv-SE");
function pFor(w){if(!state.progress[w.e])state.progress[w.e]={level:0,next:0,seen:0,correct:0};return state.progress[w.e]}
function save(){localStorage.setItem(KEY,JSON.stringify(state));refreshStats()}
function initDay(){const t=dayKey();if(state.lastDay!==t){const d=new Date();d.setDate(d.getDate()-1);state.streak=state.lastDay===d.toLocaleDateString("sv-SE")?state.streak+1:1;state.today=0;state.lastDay=t;save()}}
function refreshStats(){const ps=WORDS.map(pFor),now=Date.now();document.getElementById("xp").textContent=state.xp;document.getElementById("today").textContent=state.today;document.getElementById("mastered").textContent=ps.filter(p=>p.level>=4).length;document.getElementById("reviewDue").textContent=ps.filter(p=>p.seen>0&&p.next<=now&&p.level<5).length;document.getElementById("streakPill").textContent=`🔥 ${state.streak}日`}
initDay();refreshStats();document.getElementById("vocabCount").textContent=WORDS.length;
let session=[],idx=0,score=0,mode="mix",currentMode="choice",answered=false;
function priority(w){const p=pFor(w),now=Date.now();let s=Math.random()*10;s+=(w.weight||3)*12;if(p.seen===0)s+=45;if(p.next<=now)s+=40;s+=(5-p.level)*8;if(p.seen>0)s+=(1-(p.correct/p.seen))*30;return s}
function startSession(m){mode=m;session=[...WORDS].sort((a,b)=>priority(b)-priority(a)).slice(0,10);idx=0;score=0;document.getElementById("home").classList.add("hidden");document.getElementById("finish").classList.add("hidden");document.getElementById("weak").classList.add("hidden");document.getElementById("quiz").classList.remove("hidden");showQuestion()}
function showQuestion(){answered=false;const w=session[idx];currentMode=mode==="mix"?(idx%3===2?"flash":"choice"):mode;document.getElementById("qnum").textContent=idx+1;document.getElementById("bar").style.width=(idx*10)+"%";document.getElementById("word").textContent=w.e;document.getElementById("meaning").textContent=w.j;document.getElementById("example").textContent=w.ex;document.getElementById("exampleJp").textContent=w.jp;document.getElementById("reveal").classList.add("hidden");const choices=document.getElementById("choices");choices.innerHTML="";choices.classList.remove("hidden");document.getElementById("modeBadge").textContent=currentMode==="choice"?"4択":"自己評価";const labels={CoreA:"Core A",CoreB:"Core B",CoreC:"Core C",Phrase:"熟語",Conversation:"会話",Review:"復習"};document.getElementById("catBadge").textContent=labels[w.category]||w.category;if(currentMode==="choice"){document.getElementById("hint").textContent="意味を選ぼう";const same=WORDS.filter(x=>x.e!==w.e&&x.pos===w.pos).sort(()=>Math.random()-.5);const rest=WORDS.filter(x=>x.e!==w.e&&x.pos!==w.pos).sort(()=>Math.random()-.5);let opts=[w,...same,...rest].filter((x,i,a)=>a.findIndex(y=>y.e===x.e)===i).slice(0,4).sort(()=>Math.random()-.5);opts.forEach(c=>{const b=document.createElement("button");b.textContent=c.j;b.onclick=()=>choose(c.e===w.e,b);choices.appendChild(b)})}else{document.getElementById("hint").textContent="意味が分かったら答えを見る";const b=document.createElement("button");b.className="primary";b.textContent="答えを見る";b.onclick=()=>{choices.classList.add("hidden");document.getElementById("reveal").classList.remove("hidden")};choices.appendChild(b)}}
function choose(ok,b){if(answered)return;answered=true;const w=session[idx],p=pFor(w);p.seen++;if(ok){b.classList.add("good");score++;state.today++;state.xp+=10;p.correct++;p.level=Math.min(5,p.level+1);const mins=[5,60,1440,4320,10080,30240][p.level];p.next=Date.now()+mins*60000;save();setTimeout(nextQuestion,350)}else{b.classList.add("bad");p.level=Math.max(0,p.level-1);p.next=Date.now()+3*60000;save();document.getElementById("choices").classList.add("hidden");document.getElementById("reveal").classList.remove("hidden")}}
function rate(r){const p=pFor(session[idx]);p.seen++;if(r===2){score++;state.today++;state.xp+=10;p.correct++;p.level=Math.min(5,p.level+1)}else if(r===1){state.xp+=3;p.level=Math.max(1,p.level)}else p.level=Math.max(0,p.level-1);const mins=[3,10,60,1440,4320,10080];p.next=Date.now()+mins[p.level]*60000;save();nextQuestion()}
function nextQuestion(){document.getElementById("choices").classList.remove("hidden");idx++;if(idx>=session.length)return finishSession();showQuestion()}
function finishSession(){document.getElementById("quiz").classList.add("hidden");document.getElementById("finish").classList.remove("hidden");document.getElementById("bar").style.width="100%";document.getElementById("scoreText").textContent=`${score} / 10 正解`;document.getElementById("finishText").textContent=score>=9?"かなり定着。今日はここで終了でOK。":score>=7?"いいペース。間違えた単語は次回早めに出ます。":"苦手語を優先して回します。今日は量を増やさなくてOK。"}
function showHome(){document.getElementById("quiz").classList.add("hidden");document.getElementById("finish").classList.add("hidden");document.getElementById("weak").classList.add("hidden");document.getElementById("home").classList.remove("hidden");document.getElementById("bar").style.width="0";refreshStats()}
function showWeak(){document.getElementById("home").classList.add("hidden");document.getElementById("weak").classList.remove("hidden");const ranked=[...WORDS].filter(w=>pFor(w).seen>0).sort((a,b)=>{const pa=pFor(a),pb=pFor(b);return(pa.correct/pa.seen)-(pb.correct/pb.seen)||pa.level-pb.level}).slice(0,10);document.getElementById("weakList").innerHTML=ranked.length?ranked.map((w,i)=>{const p=pFor(w);const rt=Math.round((p.correct/p.seen)*100);return `<div style="padding:10px 0;border-bottom:1px solid #334155"><b>${i+1}. ${w.e}</b> — ${w.j}<div class="small" style="text-align:left">${w.category} / 重要度 ${w.weight} / 正答率 ${rt}% / 学習 ${p.seen}回</div></div>`}).join(""):'<div class="small">まだ学習データがありません。</div>'}
function speakWord(){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(session[idx].e);u.lang="en-US";u.rate=.85;speechSynthesis.speak(u)}
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.webmanifest">
  <title>英検3級 5分トレーナー</title>
  <style>
    :root{--bg:#0b1220;--card:#111827;--card2:#1f2937;--text:#f8fafc;--muted:#94a3b8;--accent:#38bdf8;--good:#22c55e;--warn:#f59e0b;--bad:#ef4444;--line:#334155}
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(180deg,#0b1220,#111827);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
    .wrap{max-width:760px;margin:auto;padding:18px 16px 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
    h1{font-size:20px;margin:0}.pill{padding:7px 10px;border-radius:999px;background:#0b1220;border:1px solid var(--line);font-size:13px;color:var(--muted)}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
    .stat b{display:block;font-size:19px}.stat span{font-size:11px;color:var(--muted)}.progress{height:8px;background:#0b1220;border-radius:999px;overflow:hidden;margin-bottom:18px}
    .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#38bdf8,#818cf8)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px 18px;min-height:380px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 16px 40px #0006}
    .small{font-size:13px;color:var(--muted);text-align:center}.word{font-size:42px;font-weight:900;text-align:center;margin:12px 0 4px}.meaning{font-size:25px;font-weight:800;text-align:center;margin:10px 0}
    .example{font-size:17px;line-height:1.6;text-align:center;margin:12px 0;color:#dbeafe}.jp{font-size:14px;color:var(--muted);text-align:center}
    button{appearance:none;border:none;border-radius:15px;padding:14px 12px;font-weight:800;font-size:16px;cursor:pointer;color:white;background:var(--card2);border:1px solid var(--line)}
    button.primary{background:linear-gradient(135deg,#0284c7,#4f46e5);border:none}button.good{background:#14532d;border-color:#166534}.warn{background:#78350f!important;border-color:#92400e!important}.bad{background:#7f1d1d!important;border-color:#991b1b!important}
    .row{display:flex;gap:10px;margin-top:14px}.row>*{flex:1}.menu,.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.menu button{min-height:90px}.choices button{min-height:60px}
    .hidden{display:none!important}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#172554;color:#bfdbfe;font-size:12px}.result{font-size:26px;font-weight:900;text-align:center}
    .install{margin-top:12px;background:#0b1220;border:1px dashed var(--line);border-radius:14px;padding:10px;text-align:center;color:var(--muted);font-size:12px}.spellbox{margin-top:18px}.spellbox input{width:100%;font-size:22px;padding:15px 16px;border-radius:14px;border:1px solid var(--line);background:#0b1220;color:var(--text);outline:none;text-align:center}.spellbox input:focus{border-color:var(--accent)}.spellmsg{text-align:center;margin-top:10px;font-weight:700;min-height:24px}
    @media(max-width:540px){.stats{grid-template-columns:repeat(2,1fr)}.choices,.menu{grid-template-columns:1fr}.word{font-size:38px}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>英検3級 5分トレーナー <span style="font-size:11px;color:#94a3b8">v1.3.0</span></h1><div class="pill" id="streakPill">🔥 0日</div></div>
  <div class="stats">
    <div class="stat"><b id="xp">0</b><span>XP</span></div><div class="stat"><b id="today">0</b><span>今日の正解</span></div>
    <div class="stat"><b id="mastered">0</b><span>卒業語</span></div><div class="stat"><b id="reviewDue">0</b><span>重点語</span></div>
  </div>
  <div class="progress"><i id="bar"></i></div>
  <section id="home" class="card">
    <div class="small">EIKEN Grade 3 Vocabulary Core v1 ・ Writing v1.3.0</div>
    <div class="word" style="font-size:30px">今日も10問だけ。<br><span style="font-size:14px;color:#94a3b8"><span id="vocabCount"></span>項目から最適化</span></div><div class="meaning">出題は4択とスペル入力の2形式だけ。おすすめは4択7問＋スペル3問。</div>
    <div class="menu">
      <button class="primary" onclick="startSession('mix')">🎯 おすすめ<br><span class="small">4択7問＋スペル3問</span></button>
      <button onclick="startSession('choice')">⚡ 4択だけ<br><span class="small">テンポ重視</span></button>
      <button onclick="startSession('spell')">✍️ スペル<br><span class="small">日本語 → 英語</span></button>
      <button onclick="showWeak()">📉 苦手TOP<br><span class="small">弱点を見る</span></button>
    </div>
    <div class="install">Chromeで開いて使えます。学習履歴はこの端末に保存されます。</div>
  </section>
  <section id="quiz" class="card hidden">
    <div class="small"><span id="qnum">1</span> / 10　<span class="badge" id="modeBadge">4択</span>　<span class="badge" id="catBadge">Core A</span>　<span class="badge" id="stateBadge">新規</span></div>
    <div class="word" id="word"></div><div class="small" id="hint"></div><div class="row"><button id="speakBtn" onclick="speakWord()">🔊 発音</button></div>
    <div id="choices" class="choices"></div>
    <div id="reveal" class="hidden"><div class="meaning" id="meaning"></div><div class="example" id="example"></div><div class="jp" id="exampleJp"></div>
      <div class="row"><button class="primary" onclick="nextQuestion()">次へ</button></div>
    </div>
  </section>
  <section id="finish" class="card hidden"><div class="result">🎉 5分終了</div><div class="meaning" id="scoreText"></div><div class="small" id="finishText"></div>
    <div class="row"><button class="primary" onclick="showHome()">今日は終了</button><button onclick="startSession('mix')">もう10問</button></div>
  </section>
  <section id="weak" class="card hidden"><div class="result">📉 苦手TOP10</div><div id="weakList" style="margin-top:14px"></div><div class="row"><button class="primary" onclick="showHome()">戻る</button></div></section>
</div>
<script src="vocab-v1.js?v=130"></script>
<script>
const WORDS=window.EIKEN_VOCAB;

const KEY="eiken3_webapp_v2";let state=JSON.parse(localStorage.getItem(KEY)||"{}");state.progress=state.progress||{};state.xp=state.xp||0;state.today=state.today||0;state.lastDay=state.lastDay||"";state.streak=state.streak||0;
const dayKey=()=>new Date().toLocaleDateString("sv-SE");
function pFor(w){
  if(!state.progress[w.e])state.progress[w.e]={level:0,next:0,seen:0,correct:0,streak:0,lapses:0,days:[],graduated:false,fastCandidate:false,focusUntil:0,lastSeen:0};
  const p=state.progress[w.e];
  if(p.streak==null)p.streak=0;if(p.lapses==null)p.lapses=0;if(!Array.isArray(p.days))p.days=[];if(p.graduated==null)p.graduated=false;if(p.fastCandidate==null)p.fastCandidate=false;if(p.focusUntil==null)p.focusUntil=0;if(p.lastSeen==null)p.lastSeen=0;if(p.writingSeen==null)p.writingSeen=0;if(p.writingCorrect==null)p.writingCorrect=0;
  return p
}
function save(){localStorage.setItem(KEY,JSON.stringify(state));refreshStats()}
function initDay(){const t=dayKey();if(state.lastDay!==t){const d=new Date();d.setDate(d.getDate()-1);state.streak=state.lastDay===d.toLocaleDateString("sv-SE")?state.streak+1:1;state.today=0;state.lastDay=t;save()}}
function refreshStats(){const ps=WORDS.map(pFor),now=Date.now();document.getElementById("xp").textContent=state.xp;document.getElementById("today").textContent=state.today;document.getElementById("mastered").textContent=ps.filter(p=>p.graduated).length;document.getElementById("reviewDue").textContent=ps.filter(p=>!p.graduated&&(p.lapses>0||p.focusUntil>now)).length;document.getElementById("streakPill").textContent=`🔥 ${state.streak}日`}
initDay();refreshStats();document.getElementById("vocabCount").textContent=WORDS.length;
let session=[],idx=0,score=0,mode="mix",currentMode="choice",answered=false;
function priority(w){
  const p=pFor(w),now=Date.now();let s=Math.random()*8+(w.weight||3)*14;
  if(w.category==="CoreA")s+=22;if(w.category==="Phrase"||w.category==="Conversation")s+=12;
  if(p.seen===0)s+=55;
  if(p.next<=now&&p.seen>0)s+=48;
  if(p.focusUntil>now)s+=70;
  if(p.lapses>0)s+=Math.min(90,p.lapses*30);
  if(p.seen>0)s+=(1-(p.correct/Math.max(1,p.seen)))*45;
  s+=(5-p.level)*9;
  if(p.fastCandidate&&p.next>now)s-=35;
  if(p.graduated)s-=140;
  if(p.graduated&&p.next<=now)s+=70;
  return s
}
function buildSession(){return [...WORDS].sort((a,b)=>priority(b)-priority(a)).slice(0,10)}
function startSession(m){mode=m;session=buildSession();idx=0;score=0;document.getElementById("home").classList.add("hidden");document.getElementById("finish").classList.add("hidden");document.getElementById("weak").classList.add("hidden");document.getElementById("quiz").classList.remove("hidden");showQuestion()}
function markDay(p){const d=dayKey();if(!p.days.includes(d))p.days.push(d);if(p.days.length>5)p.days=p.days.slice(-5)}
function maybeGraduate(w,p){
  if(p.graduated)return;
  const fastPass=p.fastCandidate&&p.streak>=2&&p.days.length>=2&&p.lapses===0&&p.writingCorrect>=1;
  const normalPass=p.level>=4&&p.streak>=3&&p.days.length>=2&&p.correct>=3&&p.writingCorrect>=1;
  if(fastPass||normalPass){p.graduated=true;p.focusUntil=0;p.next=Date.now()+21*24*60*60*1000;state.xp+=25}
}
function recordResult(w,kind){
  const p=pFor(w),now=Date.now(),wasNew=p.seen===0;
  p.seen++;p.lastSeen=now;markDay(p);
  if(kind==="correct"){
    p.correct++;p.streak++;p.level=Math.min(5,p.level+1);state.today++;state.xp+=10;
    if(wasNew&&p.lapses===0&&(w.category==="CoreA"||w.weight>=5))p.fastCandidate=true;
    const mins=[10,180,1440,4320,10080,30240][p.level];p.next=now+mins*60000;p.focusUntil=0;maybeGraduate(w,p)
  }else if(kind==="writing"){
    p.correct++;p.writingSeen++;p.writingCorrect++;p.streak++;p.level=Math.min(5,p.level+1);state.today++;state.xp+=15;
    if(wasNew&&p.lapses===0&&(w.category==="CoreA"||w.weight>=5))p.fastCandidate=true;
    const mins=[20,240,1440,4320,10080,30240][p.level];p.next=now+mins*60000;p.focusUntil=0;maybeGraduate(w,p)
  }else if(kind==="writingWrong"){
    p.writingSeen++;p.streak=0;p.fastCandidate=false;p.graduated=false;p.lapses++;p.level=Math.max(0,p.level-1);p.next=now+3*60000;p.focusUntil=now+48*60*60*1000
  }else if(kind==="known"){
    p.correct++;p.streak++;p.level=Math.min(5,p.level+1);state.today++;state.xp+=8;
    if(wasNew&&p.lapses===0&&(w.category==="CoreA"||w.weight>=5))p.fastCandidate=true;
    const mins=[10,120,1440,4320,10080,30240][p.level];p.next=now+mins*60000;p.focusUntil=0;maybeGraduate(w,p)
  }else if(kind==="unsure"){
    p.streak=0;p.fastCandidate=false;p.level=Math.max(1,p.level);p.next=now+10*60000;p.focusUntil=now+24*60*60*1000;state.xp+=2
  }else{
    p.streak=0;p.fastCandidate=false;p.graduated=false;p.lapses++;p.level=Math.max(0,p.level-1);p.next=now+3*60000;p.focusUntil=now+36*60*60*1000
  }
  save()
}
function requeueFailed(w){
  if(idx>=7)return;
  if(session.slice(idx+1).some(x=>x.e===w.e))return;
  const at=Math.min(session.length-1,idx+3);
  session.splice(at,0,w);session.pop()
}
function showQuestion(){
  answered=false;
  const w=session[idx],p=pFor(w);
  if(mode==="mix"){
    const n=idx+1;
    currentMode=[3,6,9].includes(n)?"spell":"choice";
  }else currentMode=mode;

  document.getElementById("qnum").textContent=idx+1;
  document.getElementById("bar").style.width=(idx*10)+"%";
  document.getElementById("meaning").textContent=w.j;
  document.getElementById("example").textContent=w.ex;
  document.getElementById("exampleJp").textContent=w.jp;
  document.getElementById("reveal").classList.add("hidden");

  const choices=document.getElementById("choices");
  const oldSpell=document.getElementById("spellArea");
  if(oldSpell)oldSpell.classList.add("hidden");
  choices.innerHTML="";
  choices.classList.remove("hidden");

  const labels={CoreA:"Core A",CoreB:"Core B",CoreC:"Core C",Phrase:"熟語",Conversation:"会話",Review:"復習"};
  document.getElementById("catBadge").textContent=labels[w.category]||w.category;
  document.getElementById("stateBadge").textContent=p.graduated?"卒業":p.lapses>0?"重点":p.fastCandidate?"卒業候補":p.seen>0?"復習":"新規";

  const speakBtn=document.getElementById("speakBtn");

  if(currentMode==="spell"){
    document.getElementById("modeBadge").textContent="✍️ スペル入力";
    document.getElementById("word").textContent=w.j;
    document.getElementById("hint").textContent="日本語を英語で書いてください";
    if(speakBtn)speakBtn.style.display="none";
    choices.innerHTML=`
      <div style="grid-column:1/-1;width:100%;margin-top:4px">
        <div style="font-size:13px;color:#94a3b8;text-align:center;margin-bottom:8px">4択ではありません。キーボードで入力します。</div>
        <input id="spellInput" type="text" inputmode="text" autocomplete="off" autocapitalize="none" spellcheck="false"
          placeholder="ここに英語を入力"
          style="width:100%;font-size:22px;padding:16px;border-radius:14px;border:1px solid #334155;background:#0b1220;color:#f8fafc;text-align:center;outline:none">
        <div id="spellMsg" style="text-align:center;margin-top:10px;font-weight:800;min-height:24px"></div>
        <button class="primary" onclick="checkSpelling()" style="width:100%;margin-top:8px">答える</button>
      </div>`;
    setTimeout(()=>{const inp=document.getElementById("spellInput");if(inp)inp.focus()},100);
    return;
  }

  if(speakBtn)speakBtn.style.display="";
  document.getElementById("word").textContent=w.e;
  document.getElementById("modeBadge").textContent="4択";

  document.getElementById("hint").textContent="意味を選ぼう";
  const same=WORDS.filter(x=>x.e!==w.e&&x.pos===w.pos).sort(()=>Math.random()-.5);
  const rest=WORDS.filter(x=>x.e!==w.e&&x.pos!==w.pos).sort(()=>Math.random()-.5);
  let opts=[w,...same,...rest].filter((x,i,a)=>a.findIndex(y=>y.e===x.e)===i).slice(0,4).sort(()=>Math.random()-.5);
  opts.forEach(c=>{const b=document.createElement("button");b.textContent=c.j;b.onclick=()=>choose(c.e===w.e,b);choices.appendChild(b)})
}
function normSpell(v){return v.toLowerCase().trim().replace(/[’‘]/g,"'").replace(/[.!?]+$/,"").replace(/\s+/g," ")}
function editDistance(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},()=>Array(n+1).fill(0));for(let i=0;i<=m;i++)d[i][0]=i;for(let j=0;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function checkSpelling(){
  if(answered)return;
  const w=session[idx];
  const inp=document.getElementById("spellInput"),msg=document.getElementById("spellMsg");
  if(!inp||!msg)return;
  const got=normSpell(inp.value),target=normSpell(w.e);
  if(!got){msg.textContent="入力してから答えよう";msg.style.color="#f59e0b";inp.focus();return}
  if(got===target){
    answered=true;score++;msg.textContent="✅ 正解";msg.style.color="#22c55e";recordResult(w,"writing");
    setTimeout(nextQuestion,650);return
  }
  const dist=editDistance(got,target),limit=target.length>=10?2:1;
  const retry=inp.dataset.retry||"0";
  if(retry==="0"&&dist<=limit){
    inp.dataset.retry="1";msg.textContent="惜しい！もう一度";msg.style.color="#f59e0b";inp.select();return
  }
  answered=true;msg.textContent="❌ 正解: "+w.e;msg.style.color="#ef4444";recordResult(w,"writingWrong");requeueFailed(w);
  setTimeout(()=>{
    document.getElementById("choices").classList.add("hidden");
    document.getElementById("word").textContent=w.e;
    document.getElementById("meaning").textContent=w.j;
    document.getElementById("reveal").classList.remove("hidden");
    const sb=document.getElementById("speakBtn");if(sb)sb.style.display="";
  },500)
}
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&currentMode==="spell"&&document.getElementById("spellInput")){e.preventDefault();checkSpelling()}});

function choose(ok,b){if(answered)return;answered=true;const w=session[idx];if(ok){b.classList.add("good");score++;recordResult(w,"correct");setTimeout(nextQuestion,350)}else{b.classList.add("bad");recordResult(w,"wrong");requeueFailed(w);document.getElementById("choices").classList.add("hidden");document.getElementById("reveal").classList.remove("hidden")}}
function rate(r){const w=session[idx];if(r===2){score++;recordResult(w,"known")}else if(r===1){recordResult(w,"unsure")}else{recordResult(w,"wrong");requeueFailed(w)}nextQuestion()}
function nextQuestion(){document.getElementById("choices").classList.remove("hidden");const sa=document.getElementById("spellArea");if(sa)sa.classList.add("hidden");idx++;if(idx>=session.length)return finishSession();showQuestion()}
function finishSession(){document.getElementById("quiz").classList.add("hidden");document.getElementById("finish").classList.remove("hidden");document.getElementById("bar").style.width="100%";document.getElementById("scoreText").textContent=`${score} / 10 正解`;const focus=WORDS.filter(w=>{const p=pFor(w);return !p.graduated&&(p.lapses>0||p.focusUntil>Date.now())}).length;const grad=WORDS.filter(w=>pFor(w).graduated).length;document.getElementById("finishText").textContent=score>=9?`かなり定着。卒業語 ${grad}。今日はここで終了でOK。`:score>=7?`いいペース。重点語 ${focus} は自動で早めに再出題します。`:`重点語 ${focus} を優先中。量を増やすより、短く反復します。`}
function showHome(){document.getElementById("quiz").classList.add("hidden");document.getElementById("finish").classList.add("hidden");document.getElementById("weak").classList.add("hidden");document.getElementById("home").classList.remove("hidden");document.getElementById("bar").style.width="0";refreshStats()}
function showWeak(){document.getElementById("home").classList.add("hidden");document.getElementById("weak").classList.remove("hidden");const ranked=[...WORDS].filter(w=>pFor(w).seen>0).sort((a,b)=>{const pa=pFor(a),pb=pFor(b);return(pa.correct/pa.seen)-(pb.correct/pb.seen)||pa.level-pb.level}).slice(0,10);document.getElementById("weakList").innerHTML=ranked.length?ranked.map((w,i)=>{const p=pFor(w);const rt=Math.round((p.correct/p.seen)*100);return `<div style="padding:10px 0;border-bottom:1px solid #334155"><b>${i+1}. ${w.e}</b> — ${w.j}<div class="small" style="text-align:left">${w.category} / 重要度 ${w.weight} / 正答率 ${rt}% / ミス ${p.lapses}回 / スペル ${p.writingCorrect}/${p.writingSeen} / 連続正解 ${p.streak}回</div></div>`}).join(""):'<div class="small">まだ学習データがありません。</div>'}
function speakWord(){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(session[idx].e);u.lang="en-US";u.rate=.85;speechSynthesis.speak(u)}
(async()=>{try{
  if("serviceWorker" in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs)await r.unregister()}
  if("caches" in window){const keys=await caches.keys();for(const k of keys)await caches.delete(k)}
}catch(e){}})();
</script>
</body>
</html>
